<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CuffScript — Web IDE</title>
    <meta name="description"
        content="Write and run CuffScript directly in your browser. No installation or setup required." />
    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="CuffScript — Web IDE" />
    <meta property="og:description"
        content="Write and run CuffScript directly in your browser. No installation or setup required." />
    <meta property="og:site_name" content="CuffScript" />
    <meta property="og:url" content="https://cuffscript.pages.dev/ide/" />
    <meta property="og:image" content="https://cuffscript.pages.dev/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="CuffScript — Web IDE" />
    <meta name="twitter:description"
        content="Write and run CuffScript directly in your browser. No installation or setup required." />
    <meta name="twitter:image" content="https://cuffscript.pages.dev/og-image.png" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
</head>

<body>
    <div class="app-shell app-shell--fixed">
        <div id="site-header-root"></div>

        <div class="toolbar">
            <select id="example-select" class="select" title="예제 불러오기">
                <option value="">예제 불러오기…</option>
            </select>
            <div class="toolbar-divider"></div>
            <button id="run-btn" class="btn btn-primary" type="button"></button>
            <button id="stop-btn" class="btn btn-danger" type="button" hidden></button>
            <button id="ast-btn" class="btn" type="button" title="토큰/AST 덤프 보기"></button>
            <span id="run-status" class="run-status"></span>
            <div class="toolbar-spacer"></div>
            <button id="share-btn" class="btn" type="button" title="공유 링크 복사"></button>
            <button id="download-btn" class="btn" type="button" title="현재 파일 다운로드"></button>
        </div>

        <div id="workspace" class="workspace">
            <div id="editor-pane" class="editor-pane">
                <div id="tab-bar" class="tab-bar"></div>
                <div id="editor-host" class="editor-host"></div>
            </div>

            <div id="resize-handle" class="resize-handle" role="separator" aria-orientation="vertical"
                aria-label="편집기와 출력 패널 크기 조절" tabindex="0"></div>

            <div class="side-pane">
                <div id="pane-tabs-bar" class="pane-tabs">
                    <div class="pane-tab active" data-pane="output">출력</div>
                    <div class="pane-tab" data-pane="stdin">표준 입력 (stdin)</div>
                </div>
                <div id="pane-output" class="pane-body active">
                    <div id="console" class="console"></div>
                </div>
                <div id="pane-stdin" class="pane-body">
                    <div class="stdin-panel">
                        <p class="stdin-hint">
                            <code>input()</code>이 호출되면, 이 환경에서 실시간 입력이 지원될 경우
                            실행 결과 화면에 바로 입력할 수 있는 칸이 나타납니다. 지원되지 않는
                            경우에는 여기 적어둔 내용을 위에서부터 한 줄씩 읽어갑니다. 다 쓰면 빈
                            문자열이 반환됩니다.
                        </p>
                        <p id="stdin-diagnostic" class="stdin-hint"></p>
                        <textarea id="stdin-input" class="stdin-textarea" placeholder="예: 15&#10;3.5"
                            spellcheck="false"></textarea>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="/src/ide.ts"></script>
</body>

</html>
