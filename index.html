<!doctype html>
<html lang="ko">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CuffScript — IDE</title>
    <meta name="description" content="브라우저에서 바로 실행하는 CuffScript 웹 IDE" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
</head>

<body>
    <div class="app-shell">
        <header class="site-header">
            <a class="brand" href="/">
                <svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
                    <path
                        d="M43.294 55a24.745 23.277-44.124 0 1 25.468-24h410a16.497 15.518-44.124 0 1 15.021 16l-25.077 410a24.745 23.277-44.124 0 1-25.468 24h-410a16.497 15.518-44.124 0 1-15.021-16Z"
                        fill="#008f6b" />
                    <text x="462" y="465"
                        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', 'Arial', sans-serif"
                        font-size="208" font-weight="700" font-style="italic" letter-spacing="-13" fill="#fff"
                        text-anchor="end" dominant-baseline="ideographic">CS</text>
                </svg>
                <span>CuffScript</span>
            </a>
            <nav class="site-nav">
                <a href="/" aria-current="page">IDE</a>
                <a href="/guide.html">가이드</a>
            </nav>
            <div class="header-spacer"></div>
            <div class="header-actions">
                <a id="github-link" class="icon-btn" href="https://github.com/cuffscript/cuffscript" target="_blank"
                    rel="noreferrer" title="GitHub 저장소"></a>
                <button id="theme-toggle" class="icon-btn" type="button" title="테마 전환"></button>
            </div>
        </header>

        <div class="toolbar">
            <select id="example-select" class="select" title="예제 불러오기">
                <option value="">예제 불러오기…</option>
            </select>
            <div class="toolbar-divider"></div>
            <button id="run-btn" class="btn btn-primary" type="button"></button>
            <button id="stop-btn" class="btn btn-danger" type="button" hidden></button>
            <button id="ast-btn" class="btn" type="button" title="토큰/AST 덤프 보기"></button>
            <span id="run-status" class="run-status"></span>
            <div class="toolbar-spacer"></div>
            <button id="share-btn" class="btn" type="button" title="공유 링크 복사"></button>
            <button id="download-btn" class="btn" type="button" title="현재 파일 다운로드"></button>
        </div>

        <div class="workspace">
            <div class="editor-pane">
                <div id="tab-bar" class="tab-bar"></div>
                <div id="editor-host" class="editor-host"></div>
            </div>

            <div class="side-pane">
                <div class="pane-tabs">
                    <div class="pane-tab active" data-pane="output">출력</div>
                    <div class="pane-tab" data-pane="stdin">표준 입력 (stdin)</div>
                </div>
                <div id="pane-output" class="pane-body active">
                    <div id="console" class="console"></div>
                </div>
                <div id="pane-stdin" class="pane-body">
                    <div class="stdin-panel">
                        <p class="stdin-hint">
                            <code>input()</code>이 호출될 때 위에서부터 한 줄씩 읽어옵니다. 프로그램 실행 전에
                            필요한 입력을 미리 적어두세요. 다 쓰면 빈 문자열이 반환됩니다.
                        </p>
                        <textarea id="stdin-input" class="stdin-textarea" placeholder="예: 15&#10;3.5"
                            spellcheck="false"></textarea>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
</body>

</html>
