name: Engine compatibility

# Does the site's content still work with the CuffScript engine?
# Runs every Monday, on demand, and when content / examples / scripts change.
# If it fails, the engine moved on: follow the pointers in the log, then see
# content/README.md ("엔진이 새 버전이 되면"). Nothing here needs `npm install`.

on:
    schedule:
        - cron: "17 3 * * 1"
    workflow_dispatch:
        inputs:
            engine_ref:
                description: Engine branch or tag to check against
                default: main
    push:
        paths:
            [
                "content/**",
                "src/examples/**",
                "src/generated/**",
                "src/engine/webPolicy.json",
                "scripts/**",
                ".github/workflows/engine-compat.yml",
            ]
    pull_request:
        paths:
            [
                "content/**",
                "src/examples/**",
                "src/generated/**",
                "src/engine/webPolicy.json",
                "scripts/**",
                ".github/workflows/engine-compat.yml",
            ]

permissions:
    contents: read

jobs:
    check:
        runs-on: ubuntu-latest
        env:
            ENGINE_REF: ${{ inputs.engine_ref || 'main' }}
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 22

            - name: Fetch and build the engine
              run: |
                  REPO=$(node -p "JSON.parse(require('fs').readFileSync('src/siteConfig.json','utf8')).repo")
                  git clone --depth 1 --branch "$ENGINE_REF" "https://github.com/$REPO.git" ../cuffscript
                  make -C ../cuffscript

            - name: Unit tests (including the ones that need a real cuffc)
              run: CUFFC=../cuffscript/cuffc CUFFSCRIPT_ENGINE=../cuffscript npm test

            - name: Content and examples work with this engine
              run: node scripts/check-engine.mjs --cuffc ../cuffscript/cuffc --engine ../cuffscript
